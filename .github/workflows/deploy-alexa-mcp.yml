name: Deploy Alexa MCP

on:
  push:
    paths:
      - 'alexa-mcp/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: alexa-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Lambda + API Gateway (us-west-2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: alexa-mcp/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/castme-deployer
          aws-region: us-west-2

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: sam deploy --stack-name castme-alexa-mcp --region us-west-2 --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Output API URL
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name castme-alexa-mcp --region us-west-2 --query "Stacks[0].Outputs[?OutputKey=='McpApiUrl'].OutputValue" --output text)
          echo "### MCP API URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "MCP_API_URL=$API_URL" >> "$GITHUB_ENV"
