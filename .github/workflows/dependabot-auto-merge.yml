name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Run Tests
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge labeled Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          for number in $PR_NUMBERS; do
            author=$(gh pr view "$number" --repo "$REPO" --json author --jq '.author.login')
            labels=$(gh pr view "$number" --repo "$REPO" --json labels --jq '.labels[].name')
            if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
              continue
            fi
            if printf '%s\n' "$labels" | grep -qx "automerge"; then
              gh pr merge "$number" --repo "$REPO" --squash
            fi
          done
